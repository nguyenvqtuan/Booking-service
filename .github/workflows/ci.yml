name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booking/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: booking
      DB_PASSWORD: booking
      DB_NAME: booking
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BCRYPT_ROUNDS: 4
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booking/shared build
      - run: pnpm --filter @booking/api migration:run
      - run: pnpm --filter @booking/api migration:check
      - run: pnpm --filter @booking/api test:e2e
      # BS-24: results must not depend on the server timezone.
      - run: TZ=America/New_York pnpm --filter @booking/api test:e2e
